name: Package 3COOL Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 3cool
      - main

permissions:
  contents: write

jobs:
  windows:
    name: Build unsigned 3COOL Windows installer
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Preserve shared asset fingerprints during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Write MiniMax CN runtime seed
        env:
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
        run: node scripts/write-3cool-runtime-seed.mjs
      - name: Package Windows x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
        run: npm run package:win:3cool
      - name: Publish installer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist-3cool/*.exe dist-3cool/*.yml dist-3cool/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files in dist-3cool"
            ls -la dist-3cool || true
            exit 1
          fi
          ls -lh "${files[@]}"
          tag="v0.12.1-3cool"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "3COOL Windows" --notes "Unsigned 3COOL Windows installer. MiniMax CN is seeded for first launch." --latest=false
          fi
