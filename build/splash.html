<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3COOL</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #0b1114; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 32px;
      }
      .markFrame { display: grid; place-items: center; width: 100%; transform: translateY(-40px); }
      .mark { display: block; width: min(280px, 100%); height: auto; object-fit: contain; }
    </style>
  </head>
  <body>
    <main aria-label="3COOL">
      <div class="markFrame" aria-hidden="true">
        <img class="mark" src="startup-3cool.png" width="266" height="40" alt="" />
      </div>
    </main>
  </body>
</html>
